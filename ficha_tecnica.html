<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Técnica | BIT-BUILDERS</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/ficha_tecnica/styles.css">
</head>
<body>
    <main class="sheet-shell">
        <a class="back-link" href="./index.html">Voltar para o PC Builder</a>

        <section class="sheet-hero">
            <p class="eyebrow">BIT-BUILDERS // FICHA TÉCNICA</p>
            <h1 id="title">Carregando componente...</h1>
            <p id="subtitle" class="subtitle">Aguarde enquanto buscamos as informações na base.</p>
        </section>

        <section class="sheet-grid">
            <article class="visual-card">
                <div class="image-frame">
                    <img id="component-image" alt="Imagem do componente" />
                    <div id="image-placeholder" class="image-placeholder">Sem imagem disponível</div>
                </div>
                <div class="meta-row">
                    <span id="category-chip" class="chip">categoria</span>
                </div>
            </article>

            <article class="details-card">
                <div class="card-header">
                    <h2>Especificações</h2>
                    <span id="status-badge" class="status-badge">carregando</span>
                </div>

                <div id="details-list" class="details-list"></div>
            </article>
        </section>
    </main>

    <script type="module" src="./src/ficha_tecnica/script.js?v=20260522b"></script>
</body>
</html>
