<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIT-BUILDERS</title>
  <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
  <header>
    <h1>BIT-BUILDERS</h1>
    <h2>Selecionar Componentes</h2>
  </header>

  <main class="container">
    <section class="grid-4">
      <div class="componente">
        <h3>Processador</h3>
        <select id="cpu">
          <option value="">Selecione</option>
          <option value="i5-10400F">Intel Core i5-10400F</option>
          <option value="i7-12700K">Intel Core i7-12700K</option>
        </select>
        <img id="cpu-img" src="./img/placeholder.png" alt="Imagem do processador">
        <a href="./docs/cpu.pdf" target="_blank" class="ficha">Ficha Técnica</a>
      </div>

      <div class="componente">
        <h3>Placa-Mãe</h3>
        <select id="mobo">
          <option value="">Selecione</option>
          <option value="b450">B450</option>
          <option value="z690">Z690</option>
        </select>
        <img id="mobo-img" src="./img/placeholder.png" alt="Imagem da placa-mãe">
        <a href="./docs/mobo.pdf" target="_blank" class="ficha">Ficha Técnica</a>
      </div>

      <div class="componente">
        <h3>Placa de Vídeo</h3>
        <select id="gpu">
          <option value="">Selecione</option>
          <option value="gtx1660">GTX 1660</option>
          <option value="rtx3060">RTX 3060</option>
        </select>
        <img id="gpu-img" src="./img/placeholder.png" alt="Imagem da placa de vídeo">
        <a href="./docs/gpu.pdf" target="_blank" class="ficha">Ficha Técnica</a>
      </div>

      <div class="componente">
        <h3>Memória RAM</h3>
        <select id="ram">
          <option value="">Selecione</option>
          <option value="ddr4">DDR4</option>
          <option value="ddr5">DDR5</option>
        </select>
        <img id="ram-img" src="./img/placeholder.png" alt="Imagem da memória RAM">
        <a href="./docs/ram.pdf" target="_blank" class="ficha">Ficha Técnica</a>
      </div>
    </section>

    <div class="verificacao">
      <button id="verificarBtn">Verificar Compatibilidade</button>
      <div id="status">
        <img id="loading" src="./img/loading.gif" alt="Verificando..." style="display:none;">
        <img id="success" src="./img/sucesso.png" alt="Compatível" style="display:none;">
        <img id="fail" src="./img/falha.png" alt="Incompatível" style="display:none;">
      </div>
    </div>
  </main>

  <script src="./src/script.js" defer></script>
</body>
</html>
