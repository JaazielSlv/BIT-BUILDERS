<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIT-BUILDERS</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
    <a href="admin.html" class="admin-link" id="link-login">Acesso / Perfil</a>
    <header>
        <h1>BIT-BUILDERS</h1>
        <h2>Montagem de PC</h2>
    </header>
    
    <div class="container">

        <div class="component-selector">

            <div class="component-block">
                <h3>Processador</h3>
                <select id="processadores">
                    <option value="">Carregando...</option>
                </select>
                <img id="processadores-img" src="" alt="Processador" class="component-img">
                <a id="processadores-link" href="#" class="spec-sheet-link" style="display:none;" >Ficha Técnica</a>
            </div>

            <div class="component-block">
                <h3>Placa-Mãe</h3>
                <select id="placamae">
                    <option value="">Carregando...</option>
                </select>
                <img id="placamae-img" src="" alt="Placa-Mãe" class="component-img">
                <a id="placamae-link" href="#" class="spec-sheet-link" style="display:none;" >Ficha Técnica</a>
            </div>

            <div class="component-block">
                <h3>Placa de Vídeo</h3>
                <select id="gpu">
                    <option value="">Carregando...</option>
                </select>
                <img id="gpu-img" src="" alt="Placa de Vídeo" class="component-img">
                <a id="gpu-link" href="#" class="spec-sheet-link" style="display:none;" >Ficha Técnica</a>
            </div>

            <div class="component-block">
                <h3>Memória RAM</h3>
                <select id="ram">
                    <option value="">Carregando...</option>
                </select>
                <img id="ram-img" src="" alt="Memória RAM" class="component-img">
                <a id="ram-link" href="#" class="spec-sheet-link" style="display:none;" >Ficha Técnica</a>
            </div>

            <div class="component-block">
                <h3>Fonte de Alimentação</h3>
                <select id="fonte">
                    <option value="">Carregando...</option>
                </select>
                <img id="fonte-img" src="" alt="Fonte de Alimentação" class="component-img">
                <a id="fonte-link" href="#" class="spec-sheet-link" style="display:none;" >Ficha Técnica</a>
            </div>

        </div>

        <div class="compatibility-check">
            <button class="verify-button" id="btn-check">INICIAR DIAGNÓSTICO DE SISTEMA</button>
            <h2 style="margin-top:20px; display: none;" id="result-title">Resultado do Escaneamento</h2>
            
            <div id="cyber-display" class="cyber-display" style="display:none;">
                
                <div id="loading-anim" class="status-anim" style="display: none;">
                    <div class="radar-spinner"></div>
                    <div class="cyber-text pulse">CALCULANDO SINERGIA...</div>
                </div>
                
                <div id="success-anim" class="status-anim" style="display: none;">
                    <div class="hologram-shield ok"></div>
                    <div class="cyber-text neon-cyan glitch" data-text="[ SISTEMA ESTÁVEL ]">[ SISTEMA ESTÁVEL ]</div>
                </div>
                
                <div id="failure-anim" class="status-anim" style="display: none;">
                    <div class="alert-triangle error"></div>
                    <div class="cyber-text neon-pink glitch" data-text="!!! FALHA ENCONTRADA !!!">!!! FALHA ENCONTRADA !!!</div>
                </div>
                
                <div id="compatibility-result" class="compatibility-result" style="display:none; margin-top: 20px;"></div>
            </div>
        </div>
    </div>

    <script type="module" src="./src/script.js"></script>
</body>
</html>
